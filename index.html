    <link rel="shortcut icon" type="image/webp" href="https://res.cloudinary.com/dxegdaylf/image/upload/v1779965351/prime_elite_store_mrgmmc.webp" />

    <script src="https://www.google.com/recaptcha/enterprise.js?render=6LcLYQUtAAAAAFYNuLxERzU9a7F1xr5gFb7r4Xi2"></script>
  </head>
  <body class="bg-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Safeguard script to unregister any stale service workers left in client browsers -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function() {
              console.log('[ServiceWorker] Unregistered stale worker successfully.');
            });
          }
        }).catch(function(err) {
          console.warn('[ServiceWorker] Unregistration error:', err);
        });
      }
      // Force purge old cache storage
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
  </body>
</html>
